name: Resource website

on:
  push:
    branches: [main]
    paths:
      - README.md
      - website/**
      - package.json
      - bun.lock
      - tsconfig.json
      - vite.config.ts
      - vercel.json
      - .github/workflows/website.yml
  pull_request:
    paths:
      - README.md
      - website/**
      - package.json
      - bun.lock
      - tsconfig.json
      - vite.config.ts
      - vercel.json
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
